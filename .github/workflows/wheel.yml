name: Wheel

# Runs the wheel-strategy bot every 15 min during US equity market hours.
# State (open contracts, basis, premium accumulators) lives in
# wheel_bot/state/wheel_state.json and is committed back to the branch so
# the next run knows what it already opened. Audit log and daily summary
# markdown are also persisted.

on:
  schedule:
    # Every 15 min, hours 13-21 UTC, Mon-Fri. Covers both EDT and EST
    # market hours (NYSE shifts an hour each DST flip); idempotent reconciler
    # makes idle ticks free.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only - do not place orders"
        type: boolean
        default: false

# Single run at a time. If a long run overlaps the next cron tick, the new one waits.
concurrency:
  group: wheel-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run wheel cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL || 'https://paper-api.alpaca.markets/v2' }}
          WHEEL_TICKERS: ${{ vars.WHEEL_TICKERS || 'PLTR,NANC,HOOD' }}
          WHEEL_PUT_STRIKE_OFFSET_PCT: ${{ vars.WHEEL_PUT_STRIKE_OFFSET_PCT || '10' }}
          WHEEL_CALL_STRIKE_OFFSET_PCT: ${{ vars.WHEEL_CALL_STRIKE_OFFSET_PCT || '10' }}
          WHEEL_TARGET_DTE: ${{ vars.WHEEL_TARGET_DTE || '21' }}
          WHEEL_DTE_MIN: ${{ vars.WHEEL_DTE_MIN || '14' }}
          WHEEL_DTE_MAX: ${{ vars.WHEEL_DTE_MAX || '28' }}
          WHEEL_CLOSE_PROFIT_PCT: ${{ vars.WHEEL_CLOSE_PROFIT_PCT || '50' }}
          WHEEL_CLOSE_MIN_DTE: ${{ vars.WHEEL_CLOSE_MIN_DTE || '2' }}
          WHEEL_CONTRACTS_PER_CYCLE: ${{ vars.WHEEL_CONTRACTS_PER_CYCLE || '1' }}
          WHEEL_MIN_PREMIUM_USD: ${{ vars.WHEEL_MIN_PREMIUM_USD || '10' }}
          WHEEL_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python -m wheel_bot -v run

      - name: Generate daily summary
        # Always run so a partial state from a mid-loop crash still gets
        # a summary file written.
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL || 'https://paper-api.alpaca.markets/v2' }}
        run: python -m wheel_bot -v summary

      - name: Commit updated state
        # Always run: the bot persists state per-trade, so even a crash
        # mid-loop has produced state we must commit or risk replaying STOs.
        if: always()
        run: |
          if git diff --quiet -- wheel_bot/state/; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "wheel-bot"
          git config user.email "wheel-bot@users.noreply.github.com"
          git add wheel_bot/state/
          git commit -m "chore(wheel): persist wheel state and summary"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$branch" || true
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "::warning::Failed to push state commit after 3 attempts."
          exit 1
